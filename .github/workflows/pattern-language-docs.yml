name: Update Pattern Language Documentation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  repository_dispatch:
    types: [update_pl_docs]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  generate:
    name: Update Pattern Language libraries
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7

      - name: Download plcli
        uses: dawidd6/action-download-artifact@v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          workflow_conclusion: success
          branch: master
          event: push
          name: plcli Linux
          repo: WerWolv/PatternLanguage
          check_artifacts: false
          search_artifacts: false
          if_no_artifact_found: fail

      - name: Generate documentation
        run: |
          git clone --depth 1 https://github.com/WerWolv/ImHex-Patterns
          chmod +x ./bin/plcli
          python3 scripts/generate_pattern_language_docs.py \
            --plcli ./bin/plcli \
            --patterns ./ImHex-Patterns

      - name: Verify generated documentation
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- content/docs/pattern-language/libraries

      - name: Commit generated documentation
        if: github.event_name != 'pull_request'
        uses: EndBug/add-and-commit@v10
        with:
          add: ./content/docs/pattern-language/libraries
          message: Updated Pattern Language Libraries documentation
          committer_name: GitHub Actions
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
